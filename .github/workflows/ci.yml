name: 品質チェック

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint・型・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://reardore.ivrm.jp

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: 依存関係をインストール
        # npm ArboristのedgesOut例外を回避する暫定措置。lockfile導入後はnpm ciへ移行する。
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: ESLintを実行
        run: npm run lint

      - name: 型チェックを実行
        run: npm run typecheck

      - name: 単体テストを実行
        run: npm run test

      - name: 本番ビルドを実行
        run: npm run build
